name: UI Docker checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build image
        run: |
          python3 scripts/configure_docker.py
          docker compose config --quiet
          docker build -t ai-reception-ui:test ./AIReceptionNewUI
      - name: Check container with isolated backend
        run: |
          docker network create ui-test
          docker run -d --name mock-api --network ui-test \
            -v "$PWD/AIReceptionNewUI/docker/mock_api.py:/mock_api.py:ro" \
            python:3.12-alpine python /mock_api.py
          docker run -d --name mock-meetings --network ui-test \
            -e MOCK_SERVICE=meetings \
            -v "$PWD/AIReceptionNewUI/docker/mock_api.py:/mock_api.py:ro" \
            python:3.12-alpine python /mock_api.py
          docker run -d --name ui --network ui-test -p 8080:8080 \
            -e API_UPSTREAM=http://mock-api:7071 \
            -e MEETINGS_UPSTREAM=http://mock-meetings:7071 ai-reception-ui:test
          python3 AIReceptionNewUI/docker/smoke_test.py
          docker exec ui nginx -t
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs ui || true
          docker logs mock-api || true
          docker logs mock-meetings || true
          docker rm -f ui mock-api mock-meetings || true
          docker network rm ui-test || true
