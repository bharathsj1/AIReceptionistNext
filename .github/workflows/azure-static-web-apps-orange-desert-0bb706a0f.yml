name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Feature/animation

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_DESERT_0BB706A0F }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/Vedoraeats" # App source code path
          api_location: "/Vedoraeats/api" # Api source code path - optional
          output_location: "Vedoraeats/dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
