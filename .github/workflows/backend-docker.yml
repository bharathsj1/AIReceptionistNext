name: Backend Docker checks

on:
  push:
    branches: [main]
    paths: ["ai-receptionist-func/**", "ai-smartconnect4u-jitsi/**", "scripts/**", "compose*.yaml", "AIReceptionNewUI/Dockerfile", "AIReceptionNewUI/docker/**", ".github/workflows/backend-docker.yml"]
  pull_request:
    branches: [main]
    paths: ["ai-receptionist-func/**", "ai-smartconnect4u-jitsi/**", "scripts/**", "compose*.yaml", "AIReceptionNewUI/Dockerfile", "AIReceptionNewUI/docker/**", ".github/workflows/backend-docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-receptionist-func/requirements.txt
      - name: Run backend unit tests
        working-directory: ai-receptionist-func
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SOCIAL_UPLOAD_DIR: /tmp/social-uploads
        run: |
          pip install -r requirements.txt
          pip check
          python -m unittest discover -s tests -v
      - name: Validate browser API routes and sessions
        working-directory: AIReceptionNewUI
        run: node --test tests/*.test.js
      - name: Build and start the local container stack
        run: |
          python3 scripts/configure_docker.py
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 300 -d
      - name: Check backend and UI proxy
        run: |
          test "$(curl --fail --silent http://localhost:7071/api/health)" = OK
          test "$(curl --fail --silent http://localhost:8080/api/health)" = OK
          test "$(curl --fail --silent http://localhost:8080/healthz)" = ok
          test "$(curl --fail --silent http://localhost:7072/api/health)" = OK
          curl --fail --silent http://localhost:8080/api/meetings > /tmp/meetings.json
          python3 -c "import json; assert isinstance(json.load(open('/tmp/meetings.json'))['meetings'], list)"
          test "$(curl --silent --request POST --header 'Content-Type: application/json' --data '{}' --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/meetings)" = 401
          curl --fail --silent --output /tmp/ui-index.html http://localhost:8080/
          test -s /tmp/ui-index.html
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color || true
          docker compose down --volumes || true
